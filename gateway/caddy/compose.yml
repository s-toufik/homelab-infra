services:
  caddy:
    image: caddy:${CADDY_TAG:-2.11.7}
    container_name: caddy
    restart: unless-stopped
    environment:
      HOMELAB_DOMAIN: ${HOMELAB_DOMAIN:?HOMELAB_DOMAIN must be set in .env}
      TASKER_GATEWAY_SECRET: ${TASKER_GATEWAY_SECRET:?TASKER_GATEWAY_SECRET must be set in .env}
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY:?LLM_GATEWAY_API_KEY must be set in .env}
      TZ: ${TZ:-UTC}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # Certificates for *.ts.net come from the host's Tailscale daemon
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
    # Every web port of the stack, with HTTPS and sign-in
    ports:
      - "${BIND_ADDR:-127.0.0.1}:443:443"       # homelab-ui and its APIs
      - "${BIND_ADDR:-127.0.0.1}:8443:8443"     # Keycloak sign-in pages
      - "${BIND_ADDR:-127.0.0.1}:8002:8002"     # old homelab-ui address, redirects to 443
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"     # Grafana (signs in with Keycloak)
      - "${BIND_ADDR:-127.0.0.1}:9090:9090"     # Prometheus
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"     # Kafka UI
      - "${BIND_ADDR:-127.0.0.1}:12345:12345"   # Alloy
      - "${BIND_ADDR:-127.0.0.1}:8090:8090"     # LLM playground and API (API key accepted)
      - "${BIND_ADDR:-127.0.0.1}:3100:3100"     # Loki API
      - "${BIND_ADDR:-127.0.0.1}:3200:3200"     # Tempo API
      - "${BIND_ADDR:-127.0.0.1}:9308:9308"     # kafka-exporter
      - "${BIND_ADDR:-127.0.0.1}:6274:6274"     # MCP Inspector (agent-toolbox)
    networks:
      default:
        # Containers that verify sign-ins (oauth2-proxy, Grafana) reach Keycloak's public address through Caddy
        aliases:
          - ${HOMELAB_DOMAIN}
      # agent-runtime, agent-toolbox and the MCP Inspector
      agents: {}
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256m }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy-data:
  caddy-config:

services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:${OAUTH2_PROXY_TAG:-v7.15.5}
    container_name: oauth2-proxy
    restart: unless-stopped
    depends_on:
      keycloak-sync:
        condition: service_completed_successfully
      caddy:
        condition: service_started
    environment:
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?OAUTH2_PROXY_CLIENT_SECRET must be set in .env}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?OAUTH2_PROXY_COOKIE_SECRET must be set in .env}
    command:
      - --provider=keycloak-oidc
      - --client-id=oauth2-proxy
      - --oidc-issuer-url=https://${HOMELAB_DOMAIN:?HOMELAB_DOMAIN must be set in .env}:8443/realms/homelab
      - --redirect-url=https://${HOMELAB_DOMAIN}/oauth2/callback
      - --backend-logout-url=https://${HOMELAB_DOMAIN}:8443/realms/homelab/protocol/openid-connect/logout?id_token_hint={id_token}
      - --code-challenge-method=S256
      - --email-domain=*
      - --http-address=0.0.0.0:4180
      - --upstream=static://202
      - --reverse-proxy=true
      - --set-xauthrequest=true
      - --skip-provider-button=true
      - --cookie-name=__Host-homelab
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --cookie-expire=8h
      - --whitelist-domain=${HOMELAB_DOMAIN}
      - --whitelist-domain=${HOMELAB_DOMAIN}:*
    # No published port: Caddy asks it "is this request signed in?" and serves /oauth2/
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128m }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

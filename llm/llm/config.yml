healthCheckTimeout: 3600
logLevel: info

upstream:
  ignorePaths:
    - '.*/metrics$'

macros:
  common: >
    --host 127.0.0.1 --port ${PORT}
    --jinja --chat-template-kwargs '{"enable_thinking":false}'
    --temp 0.7 --top-p 0.8 --top-k 20 --metrics

models:
  qwen3.5-0.8b:
    cmd: |
      /app/llama-server ${common}
      -hf unsloth/Qwen3.5-0.8B-GGUF:Q8_0
      --ctx-size 32768
      --parallel 1
      --threads 12
    aliases: [qwen3.5-0.8b]
    ttl: &ondemand_ttl 300

  qwen3-1.7b:
    cmd: |
      /app/llama-server ${common}
      -hf Qwen/Qwen3-1.7B-GGUF:Q8_0
      --ctx-size 32768
      --parallel 1
      --threads 12
    aliases: [qwen3-1.7b]
    ttl: *ondemand_ttl

  qwen3.5-2b:
    cmd: |
      /app/llama-server ${common}
      -hf unsloth/Qwen3.5-2B-GGUF:Q8_0
      --ctx-size 32768
      --parallel 1
      --threads 12
    aliases: [qwen3.5-2b]
    ttl: *ondemand_ttl

  lfm2-8b-a1b:
    cmd: |
      /app/llama-server ${common}
      -hf LiquidAI/LFM2-8B-A1B-GGUF:Q4_K_M
      --ctx-size 16384
      --parallel 1
      --threads 12
    aliases: [lfm2-8b-a1b]
    ttl: *ondemand_ttl

  ministral-8b-instruct-2410:
    cmd: |
      /app/llama-server ${common}
      -hf bartowski/Ministral-8B-Instruct-2410-GGUF:Q4_K_M
      --ctx-size 16384
      --parallel 1
      --threads 12
    aliases: [ministral-8b-instruct-2410]
    ttl: *ondemand_ttl

  qwen3-8b:
    cmd: |
      /app/llama-server ${common}
      -hf Qwen/Qwen3-8B-GGUF:Q4_K_M
      --ctx-size 16384
      --parallel 1
      --threads 12
    aliases: [qwen3-8b]
    ttl: 0

  gigachat3.1-10b-a1.8b:
    cmd: |
      /app/llama-server ${common}
      -hf ai-sage/GigaChat3.1-10B-A1.8B-GGUF:Q4_K_M
      --ctx-size 16384
      --parallel 1
      --threads 12
    aliases: [gigachat3.1-10b-a1.8b]
    ttl: *ondemand_ttl

  qwen3-14b:
    cmd: |
      /app/llama-server ${common}
      -hf Qwen/Qwen3-14B-GGUF:Q4_K_M
      --ctx-size 16384
      --parallel 1
      --threads 12
    aliases: [qwen3-14b]
    ttl: *ondemand_ttl

groups:
  always-on:
    swap: false
    exclusive: false
    persistent: true
    members:
      - qwen3-8b

  on-demand:
    swap: true
    exclusive: false
    persistent: false
    members:
      - qwen3.5-0.8b
      - qwen3-1.7b
      - qwen3.5-2b
      - lfm2-8b-a1b
      - ministral-8b-instruct-2410
      - gigachat3.1-10b-a1.8b
      - qwen3-14b

hooks:
  on_startup:
    preload:
      - qwen3-8b

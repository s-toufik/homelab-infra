healthCheckTimeout: 900
logLevel: info

macros:
  common: >
    --host 127.0.0.1 --port ${PORT}
    --jinja --chat-template-kwargs '{"enable_thinking":false}'
    --temp 0.7 --top-p 0.8 --top-k 20 --metrics

models:
  granite4-7b:
    cmd: |
      /app/llama-server ${common}
      -hf unsloth/granite-4.0-h-tiny-GGUF:Q4_K_M
      --ctx-size 8192 --parallel 1 --threads 6
    aliases: [granite4-7b]
    ttl: 0

  qwen3.5-2b:
    cmd: |
      /app/llama-server ${common}
      -hf unsloth/Qwen3.5-2B-GGUF:Q8_0 --no-mmproj
      --ctx-size 8192 --parallel 2 --threads 4
    aliases: [qwen3.5-2b]
    ttl: 0

groups:
  always-on:
    swap: false
    exclusive: false
    persistent: true
    members: [granite4-7b, qwen3.5-2b]

hooks:
  on_startup:
    preload: [granite4-7b]
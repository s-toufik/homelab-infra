      --rope-scaling yarn
      --rope-scale 4
      --yarn-orig-ctx 32768
      --parallel 1
      --threads 12
    aliases: [qwen3-30b-a3b]
    ttl: *ondemand_ttl

groups:
  always-on:
    swap: false
    exclusive: false
    persistent: true
    members:
      - qwen3-8b

  on-demand:
    swap: true
    exclusive: false
    persistent: false
    members:
      - lfm2-8b-a1b
      - ministral-8b-instruct-2410
      - gigachat3.1-10b-a1.8b
      - qwen3-14b
      - gpt-oss-20b
      - lfm2-24b-a2b
      - mistral-small-3-2-24b-instruct
      - gemma4-26b-a4b
      - qwen3-30b-a3b-instruct-2507

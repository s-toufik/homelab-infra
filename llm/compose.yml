services:
  llm-models-init:
    image: busybox:1.36
    user: root
    command: ["sh", "-c", "chmod 0777 /models"]
    volumes:
      - llm-models:/models
    restart: "no"

  llm:
    image: ghcr.io/mostlygeek/llama-swap:${LLAMA_SWAP_TAG:-cpu}
    container_name: llm
    restart: unless-stopped
    depends_on:
      llm-models-init:
        condition: service_completed_successfully
    environment:
      LLAMA_CACHE: /models
    command: ["-config", "/app/config.yaml", "-listen", ":8080", "-watch-config"]
    volumes:
      - llm-models:/models
      - ./config.yml:/app/config.yaml:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8090:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 1m
    deploy:
      resources:
        limits: { cpus: "16.0", memory: 26g }   # granite4-7b (always-on) + one on-demand model at a time
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  llm-models:
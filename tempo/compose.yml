services:
  tempo-init:
    image: busybox:1.36
    user: root
    command: ["sh", "-c", "chown -R 10001:10001 /var/tempo"]
    volumes:
      - tempo-data:/var/tempo
    restart: "no"

  tempo:
    image: grafana/tempo:${TEMPO_TAG:-2.8.1}
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yml"]
    depends_on:
      tempo-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
    volumes:
      - ./config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3200:3200"   # query API (OTLP stays internal, use otel-collector)
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 3g }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  tempo-data:

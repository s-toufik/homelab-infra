services:
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_TAG:-26.8.1}
    container_name: keycloak
    restart: unless-stopped
    command: ["start"]
    depends_on:
      db-provision:
        condition: service_completed_successfully
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be set in .env}
      KC_HOSTNAME: https://${HOMELAB_DOMAIN:?HOMELAB_DOMAIN must be set in .env}:8443
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set in .env}
      TZ: ${TZ:-UTC}
    # No published port: Caddy serves it on 8443 (login pages only, /admin is blocked)
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1g }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # One-shot: applies the "homelab" realm (settings, password policy, clients) from sync.sh
  keycloak-sync:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_TAG:-26.8.1}
    container_name: keycloak-sync
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/keycloak/sync/sync.sh"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set in .env}
      HOMELAB_DOMAIN: ${HOMELAB_DOMAIN}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?OAUTH2_PROXY_CLIENT_SECRET must be set in .env}
      GRAFANA_OIDC_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET:?GRAFANA_OIDC_CLIENT_SECRET must be set in .env}
    volumes:
      - ./sync.sh:/opt/keycloak/sync/sync.sh:ro
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

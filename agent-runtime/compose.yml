services:
  agent-runtime:
    image: toufik142/agent-runtime:${AGENT_RUNTIME_TAG:-latest}
    container_name: agent-runtime
    restart: unless-stopped
    labels:
      homelab.logs.otlp: "true"
    depends_on:
      otel-collector:
        condition: service_started
      mongodb:
        condition: service_healthy
      agent-toolbox:
        condition: service_started
    environment:
      APP_ENV: deploy
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      DEPLOYMENT_ENVIRONMENT: homelab
      OTEL_HOST: otel-collector
      OTEL_PORT: "4317"
      TOOLBOX_URL: http://agent-toolbox:8001/mcp
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      WEB_DOCS: ${WEB_DOCS:-false}
      AGENT_ANSWER_DELIVERY: ${AGENT_ANSWER_DELIVERY:-stream}
      MAX_CONCURRENT_STREAMS: ${MAX_CONCURRENT_STREAMS:-200}
      GUARDRAIL_ENABLED: ${GUARDRAIL_ENABLED:-false}
      DB_MONGO_CHECKPOINT_HOST: mongodb
      DB_MONGO_CHECKPOINT_PORT: "27017"
      DB_MONGO_CHECKPOINT_NAME: agent_runtime
      DB_MONGO_CHECKPOINT_USERNAME: ${MONGO_ROOT_USER}
      DB_MONGO_CHECKPOINT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      DB_SQLITE_CHECKPOINT_HOST: /data/sqlite
      DB_SQLITE_CHECKPOINT_NAME: checkpoint
      TZ: ${TZ:-UTC}
    volumes:
      - agent-runtime-data:/data/sqlite
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512m }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  agent-runtime-data:

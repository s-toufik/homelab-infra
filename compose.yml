name: homelab

include:
  # --- gateway: HTTPS and one sign-in for every web interface ---
  - gateway/caddy/compose.yml
  - gateway/keycloak/compose.yml
  - gateway/oauth2-proxy/compose.yml
  # --- repository: databases and their APIs (PostgreSQL also runs the migrations) ---
  - repository/postgres/compose.yml
  - repository/postgrest/compose.yml
  - repository/mongodb/compose.yml
  # --- message_broker: event streaming ---
  - message_broker/kafka/compose.yml
  - message_broker/kafka-ui/compose.yml
  # --- observability: metrics, logs, traces, their collectors and dashboards ---
  - observability/metrics/prometheus/compose.yml
  - observability/metrics/cadvisor/compose.yml
  - observability/metrics/kafka-exporter/compose.yml
  - observability/metrics/postgres-exporter/compose.yml
  - observability/metrics/mongodb-exporter/compose.yml
  - observability/logs/loki/compose.yml
  - observability/traces/tempo/compose.yml
  - observability/collectors/otel-collector/compose.yml
  - observability/collectors/alloy/compose.yml
  - observability/dashboards/grafana/compose.yml
  # --- ai: local models and the homelab agent ---
  - ai/llm/compose.yml
  - ai/agent-toolbox/compose.yml
  - ai/agent-runtime/compose.yml
  - ai/mcp-inspector/compose.yml
  # --- apps: what you open in the browser ---
  - apps/homelab-ui/compose.yml
  # templates/myapi-a is documentation only (see templates/myapi-a/README.md), never runs.

# Every service is on `default`, except agent-toolbox and the MCP Inspector, which run code and
# live on `agents` only, with just what they need: agent-runtime (calls the toolbox), the OTel
# Collector (their telemetry) and Caddy (the sign-in). From there they reach no database, Kafka or
# LLM; they keep internet access.
networks:
  agents: {}

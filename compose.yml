# Root compose file: aggregates every component with `include` (Docker Compose >= 2.20).
# All services share the project's default network, so they reach each other by service name.
name: homelab

include:
  # --- Observability ---
  - prometheus/compose.yml
  - loki/compose.yml
  - tempo/compose.yml
  - otel-collector/compose.yml
  - alloy/compose.yml
  - cadvisor/compose.yml
  - grafana/compose.yml
  # --- Streaming ---
  - kafka/compose.yml
  - kafka-ui/compose.yml
  - kafka-exporter/compose.yml
  # --- Databases ---
  - postgres/compose.yml
  - mongodb/compose.yml
  # --- LLM ---
  - llm/compose.yml
  # --- Applications ---
  - agent-toolbox/compose.yml
  - agent-orchestrator/compose.yml
  # myapi-a is documentation only (see myapi-a/README.md), not meant to run.

services:
  db-migrate:
    image: ghcr.io/amacneil/dbmate:${DBMATE_TAG:-2.36.0}
    container_name: db-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-homelab}@postgres:5432/${POSTGRES_DB:-homelab}?sslmode=disable
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    command: ["migrate"]
    volumes:
      - ./migrations:/db/migrations:ro
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64m }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  db-provision:
    image: postgres:${POSTGRES_TAG:-17}
    container_name: db-provision
    restart: "no"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-homelab}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGDATABASE: ${POSTGRES_DB:-homelab}
      POSTGREST_PASSWORD: ${POSTGREST_PASSWORD:?POSTGREST_PASSWORD must be set in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be set in .env}
    command: ["sh", "/db/provision.sh"]
    volumes:
      - ./provision.sh:/db/provision.sh:ro
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64m }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

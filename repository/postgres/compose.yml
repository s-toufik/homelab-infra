services:
  postgres:
    image: postgres:${POSTGRES_TAG:-17}
    container_name: postgres
    restart: unless-stopped
    shm_size: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-homelab}
      TZ: ${TZ:-UTC}
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=200
      - -c
      - wal_compression=on
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 4g }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # One-shot: applies the migrations in ./migrations not applied yet (dbmate), then exits
  db-migrate:
    image: ghcr.io/amacneil/dbmate:${DBMATE_TAG:-2.36.0}
    container_name: db-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-homelab}@postgres:5432/${POSTGRES_DB:-homelab}?sslmode=disable
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    command: ["migrate"]
    volumes:
      - ./migrations:/db/migrations:ro
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64m }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # One-shot: role passwords from .env and the keycloak database (provision.sh), then exits
  db-provision:
    image: postgres:${POSTGRES_TAG:-17}
    container_name: db-provision
    restart: "no"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-homelab}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGDATABASE: ${POSTGRES_DB:-homelab}
      POSTGREST_PASSWORD: ${POSTGREST_PASSWORD:?POSTGREST_PASSWORD must be set in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be set in .env}
    command: ["sh", "/db/provision.sh"]
    volumes:
      - ./provision.sh:/db/provision.sh:ro
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64m }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  postgres-data:

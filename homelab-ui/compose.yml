services:
  homelab-ui:
    image: toufik142/homelab-ui:${HOMELAB_UI_TAG:-latest}
    container_name: homelab-ui
    restart: unless-stopped
    depends_on:
      agent-runtime:
        condition: service_started
    environment:
      TZ: ${TZ:-UTC}
    # No published port: served by Caddy at https://${HOMELAB_DOMAIN}/ (old port 8002 redirects there)
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128m }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

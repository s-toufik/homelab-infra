global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: homelab

# OTLP ingestion (app metrics coming from the OTel Collector)
otlp:
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - deployment.environment

storage:
  tsdb:
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: kafka-exporter
    scrape_interval: 30s
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: llama-cpp
    static_configs:
      - targets: [ "llm:8080" ]
        labels:
          model: granite4-7b
          __metrics_path__: /upstream/granite4-7b/metrics
      - targets: [ "llm:8080" ]
        labels:
          model: qwen3.5-2b
          __metrics_path__: /upstream/qwen3.5-2b/metrics
